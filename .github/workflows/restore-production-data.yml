name: Restore 500 ps production data

on:
  push:
    paths:
      - 'staging/**'
      - '.github/workflows/restore-production-data.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Decode and restore files
        shell: bash
        run: |
          set -euo pipefail

          base64 --decode staging/log.nvt_prod_long.lammps.gz.b64 > /tmp/log.nvt_prod_long.lammps.gz
          gzip --decompress --stdout /tmp/log.nvt_prod_long.lammps.gz > log.nvt_prod_long.lammps

          base64 --decode staging/thermo_avg_prod_long.dat.gz.b64 > /tmp/thermo_avg_prod_long.dat.gz
          gzip --decompress --stdout /tmp/thermo_avg_prod_long.dat.gz > thermo_avg_prod_long.dat

          test "$(sha256sum log.nvt_prod_long.lammps | awk '{print $1}')" = "9bce39671764b8e9650e8215cc67c1505ec41bbac0b6b604fa2c6524ed61b035"
          test "$(sha256sum thermo_avg_prod_long.dat | awk '{print $1}')" = "7fea3bbe178a6fe3f771cd4bc9f99799afb8516c127d35d957861b1c75d90c42"

          grep -q '^ *1000000 ' log.nvt_prod_long.lammps
          grep -q '^1000000 ' thermo_avg_prod_long.dat

          rm -rf staging

      - name: Commit restored production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log.nvt_prod_long.lammps thermo_avg_prod_long.dat staging
          git commit -m "Restore complete 500 ps production log and thermodynamic averages"
          git push origin main
