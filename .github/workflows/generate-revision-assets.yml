name: Generate revision assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_revision_assets.py'
      - 'log.*.lammps'
      - 'msd_*.dat'
      - 'thermo_avg_prod_long.dat'
      - '.github/workflows/generate-revision-assets.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/generate_revision_assets.py'
      - 'log.*.lammps'
      - 'msd_*.dat'
      - 'thermo_avg_prod_long.dat'
      - '.github/workflows/generate-revision-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revision-assets-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy matplotlib

      - name: Generate statistics and figures
        run: python scripts/generate_revision_assets.py

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis figures
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "Regenerate revision figures and analysis [skip ci]"
          BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"

          # A human or another task may have pushed while figures were being rendered.
          # Rebase the generated commit on the newest branch tip before publishing it.
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
